version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: lostlink-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/lostlink.db:/app/lostlink.db
      - ../backend/uploads:/app/uploads
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: lostlink-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
